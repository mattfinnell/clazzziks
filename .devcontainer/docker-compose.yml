# Dev container topology. Defines the workspace container ("app") and the
# Postgres `db` service under one compose project, so they share a network and
# the backend reaches Postgres at `db:5432` with no manual `docker network
# connect` — and the Postgres data volume persists across devcontainer rebuilds.
#
# The backend reads CLAZZZIKS_DATABASE_URL (set on `app` below); the test suite
# uses the separate `clazzziks_test` database created on first boot.
services:
  app:
    build:
      # Compose resolves relative paths against the directory holding this file
      # (.devcontainer/), NOT the repo root. So context `.` is .devcontainer/ and
      # `dockerfile` is relative to that context. Keeping the context at
      # .devcontainer/ is intentional: the Dockerfile COPYs nothing, so there's no
      # reason to ship the whole repo (node_modules, infra/, frontend/) as build
      # context. The repo root is brought in via the bind mount below.
      context: .
      dockerfile: Dockerfile
    volumes:
      # `..` is the repo root (one up from .devcontainer/).
      - ..:/workspaces/clazzziks:cached
    # Keep the container alive; the devcontainer attaches to it.
    command: sleep infinity
    environment:
      # The whole app + test suite read these — no per-shell export needed.
      CLAZZZIKS_DATABASE_URL: postgresql+psycopg://clazzziks:clazzziks@db:5432/clazzziks
      CLAZZZIKS_TEST_DATABASE_URL: postgresql+psycopg://clazzziks:clazzziks@db:5432/clazzziks_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clazzziks
      POSTGRES_PASSWORD: clazzziks
      POSTGRES_DB: clazzziks
    ports:
      - "5432:5432"
    volumes:
      - clazzziks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clazzziks -d clazzziks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clazzziks_pgdata:
