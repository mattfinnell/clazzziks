name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Newer runs on the same branch/PR cancel older in-flight ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; individual jobs opt into more if needed.
permissions:
  contents: read

jobs:
  # ── Detect which parts of the repo changed, so language jobs only run when
  #    relevant. Outputs are consumed via `needs.changes.outputs.*`.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'

  # ── Reuses the repo's pre-commit hooks (hygiene checks) so CI enforces
  #    exactly what runs locally — no second source of truth.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1

  # ── Python backend: pytest against a real Postgres (matches the devcontainer's
  #    `db` service — see backend/CLAUDE.md). e2e tests (real network) are excluded.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: clazzziks
          POSTGRES_PASSWORD: clazzziks
          POSTGRES_DB: clazzziks_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLAZZZIKS_DATABASE_URL: postgresql+psycopg://clazzziks:clazzziks@localhost:5432/clazzziks
      CLAZZZIKS_TEST_DATABASE_URL: postgresql+psycopg://clazzziks:clazzziks@localhost:5432/clazzziks_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --extra dev
      - run: uv run pytest -m "not e2e"

  # ── React frontend: typecheck + build (tsc -b && vite build).
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ── Pulumi infra: TypeScript must compile before `pulumi preview`/`up` can run.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # ── Single check to require in branch protection. Green only when no needed job
  #    failed or was cancelled (skipped path-filtered jobs are fine).
  ci:
    if: always()
    needs: [lint, backend, frontend, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass ($r)."
              exit 1
            fi
          done
